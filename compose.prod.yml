x-logging: &default-logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  ws-control:
    build:
      context: ./ws-control
    ports:
      - "8787:8787"
    environment:
      - CONTROL_TOKEN=devsecret
      - NODE_ENV=production
      - LOG_DIR=/app/logs
    volumes:
      - ws-control-logs:/app/logs
    logging: *default-logging
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging: *default-logging

volumes:
  ws-control-logs:
